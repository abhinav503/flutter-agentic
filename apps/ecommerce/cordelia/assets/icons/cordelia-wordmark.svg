<svg viewBox="0 0 510 100" xmlns="http://www.w3.org/2000/svg">
  <!--
    C mark sized to Inter Bold 66px cap height (~48px).
    C bounding box in 1024-space: y 182–842 (h=660), x 182–875 (w=693).
    scale = 48/660 = 0.07273
    Top of caps = baseline(74) - capHeight(48) = 26
    translateX = 9  - 182*0.07273 = -4.24
    translateY = 26 - 182*0.07273 = 12.76
    Arrow tip lands at screen x = 875*0.07273 - 4.24 = 59.4
  -->
  <g transform="translate(-4.24,12.76) scale(0.07273)">
    <path
      d="M 757 291 A 330 330 0 1 0 757 733 L 875 512 L 661 646 A 200 200 0 1 1 661 378 Z"
      fill="#7059FF"
    />
  </g>
  <!-- "ordelia Apps" — the C mark above IS the C -->
  <text font-family="Inter" font-size="66" y="74">
    <tspan x="62" font-weight="700" fill="#111827">ordelia</tspan><tspan font-weight="500" fill="#7059FF"> Apps</tspan>
  </text>
</svg>
