name: cordelia
description: CordeliaApps — the multi-store super app entry point (store discovery, shared shopper auth).
publish_to: 'none'
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Per-store Hindi (gravia template) — gen-l10n .arb strings exposed via
  # the L10n.current static holder (lib/l10n/); MaterialApp gets its
  # delegates + supportedLocales from the generated AppLocalizations.
  flutter_localizations:
    sdk: flutter
  intl: any

  core:
    path: ../../../packages/core

  # Firebase (email/password auth — feature/auth), shared corderlia-ecom
  # project/user pool with gravia (see /connect-firebase).
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0

  # Shopper avatars — Edit Profile uploads the picked photo to
  # users/{uid}/avatar.jpg and sends the download URL to the admin API,
  # which stores it on the Firestore profile doc as `avatar_url`.
  firebase_storage: ^13.0.5

  # feature/auth's remote data source builds a Dio Options object directly
  # (Authorization header) — HttpService (core) doesn't expose that shape.
  dio: ^5.8.0+1

  # State management
  flutter_bloc: ^9.1.1

  # Navigation
  go_router: ^17.2.3

  # Functional error handling
  fpdart: ^1.1.0

  # Debounced+restartable event transformer for search-as-you-type
  # (DiscoveryBloc's store search) — the bloc-docs-recommended way to
  # compose debounce with switchMap without pulling in rxdart.
  stream_transform: ^2.1.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Brand SVG rendering (splash wordmark glyph)
  flutter_svg: ^2.3.0

  # The grofast pack sets prices and small meta in a second family
  # (Montserrat) against the theme's Raleway — a theme preset carries one
  # fontFamily, so that one pairing is resolved at the call site.
  google_fonts: ^6.2.1
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.9.5
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
  get_it: ^8.0.1
  shared_preferences: ^2.3.3

flutter:
  uses-material-design: true
  # Lets `flutter gen-l10n` run (output goes to lib/l10n/gen per l10n.yaml —
  # no synthetic package involved).
  generate: true

  assets:
    - assets/theme/theme_config.json
    - assets/theme/templates/gravia_theme_config.json
    - assets/theme/templates/dailymart_theme_config.json
    - assets/theme/templates/grofast_theme_config.json
    # App-level assets (Cordelia brand marks, auth-provider logos, the shared
    # back arrow). A directory entry is NOT recursive, so each storefront
    # template's pack folder below needs its own line — adding a template
    # means adding a line per asset kind it ships (icons / images / data).
    - assets/icons/
    - assets/images/
    - assets/icons/templates/gravia/
    - assets/data/templates/gravia/
    # dailymart ships no pack images yet — icons and mock data only.
    - assets/icons/templates/dailymart/
    - assets/data/templates/dailymart/
    # grofast likewise — its artwork all comes from the store's own catalog.
    - assets/icons/templates/grofast/
    - assets/data/templates/grofast/

# One source mark → every launcher-icon size. branding/ holds these
# build-time generator sources and lives OUTSIDE assets/ on purpose — it
# must never be registered as a flutter asset (assets/icons/ = runtime
# SVGs; assets/images/ = runtime raster images).
# Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: branding/app_icon.png
  # The identity board's near-black, matching the full-bleed icon and the web
  # console's favicon. Not white: the swift mark is a mid-tone teal gradient,
  # so on a white adaptive background it loses the contrast the brand mark is
  # drawn to have — and the two icon shapes Android may render (full-bleed vs
  # adaptive) would no longer look like the same icon.
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: branding/app_icon_foreground.png
  web:
    generate: true
    image_path: branding/app_icon.png

# Native boot splash (kills the white flash before Flutter's first frame).
# Android 12+ centers the launcher icon by default.
# Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0C0503"
  image: branding/splash_logo.png
  web: true
  android_12:
    color: "#FFFFFF"
    color_dark: "#0C0503"
    image: branding/splash_logo_android12.png
