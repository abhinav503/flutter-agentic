<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.16 11.23 69.05 45.26" fill="none" role="img" aria-label="CordeliaApps">
  <!--
    The CordeliaApps swift mark, exported from Figma
    (symbol-swift-bird, node 7:120). Path data and gradients are the
    designer's, unmodified.

    Two changes from the raw export, both necessary to make it usable outside
    the dark artboard it was drawn on:

    1. facet-cut is a MASK, not a stroke. Figma exported it as a 2px line
       filled #0A0A0B — the page background painted over the wings, which
       reads as a gap on that dark canvas and as a black slash on anything
       else. As a mask it is a genuine transparent gap, so the mark sits on
       light, dark or photographic surfaces identically.
    2. The viewBox is tightened to the artwork's bounding box. The export was
       an 80x80 frame with the mark occupying y 11-56, so it hung high in any
       square container. Gradients are userSpaceOnUse and keep the original
       coordinates, so tightening the window does not move them.
  -->
  <defs>
    <linearGradient id="ca-wing-top" x1="6.67" y1="10" x2="71.0683" y2="27.2555" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007A60"/>
      <stop offset="1" stop-color="#2DA987"/>
    </linearGradient>
    <linearGradient id="ca-wing-bottom" x1="16.67" y1="33.33" x2="71.409" y2="18.6627" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007A60"/>
      <stop offset="1" stop-color="#2DA987"/>
    </linearGradient>
    <linearGradient id="ca-head" x1="56.67" y1="14.67" x2="48.2176" y2="32.7962" gradientUnits="userSpaceOnUse">
      <stop stop-color="#007A60"/>
      <stop offset="1" stop-color="#2DA987"/>
    </linearGradient>
    <mask id="ca-facet-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="80" height="80">
      <rect width="80" height="80" fill="#fff"/>
      <line x1="10.3746" y1="32.4028" x2="62.9181" y2="53.6318" stroke="#000" stroke-width="2"/>
    </mask>
  </defs>
  <g mask="url(#ca-facet-cut)">
    <path d="M38.8691 18.6277L60.931 47.8329L5.16044 32.8892L38.8691 18.6277Z" fill="url(#ca-wing-top)"/>
    <path d="M44.0395 25.9964L74.212 43.791L26.8067 56.4932L44.0395 25.9964Z" fill="url(#ca-wing-bottom)"/>
    <path d="M52.4438 23.7331L38.8122 26.9321L46.1321 11.2344L52.4438 23.7331Z" fill="url(#ca-head)"/>
  </g>
</svg>
