name: core
description: Shared infrastructure, design system, and base classes for all FlutterAgentic apps.
publish_to: 'none'
version: 1.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Service locator (shared `sl` lives here; every app registers against it)
  get_it: ^8.0.1

  # Networking (HttpService owns the single Dio instance)
  dio: ^5.8.0+1

  # Persistence (SharedPreferenceService static singleton)
  shared_preferences: ^2.3.3

  # Device utilities — core is the shared mobile toolbelt
  image_picker: ^1.1.2
  # Imported directly by ImagePickerService to opt into the Android Photo
  # Picker — the flag lives on the Android implementation class, so the
  # federated plugin's own package has to be a direct dependency. Neither
  # package touches dart:io, so this stays web-safe with no conditional
  # import (see the platform-code rule in docs/ai-rules/conventions.md).
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.10.0
  # LocationService (device GPS; ships a web implementation, so no
  # conditional import needed)
  geolocator: ^14.0.2
  # …and turning that fix into a place name, on the device's own geocoder
  # (Android's Geocoder, iOS's CLGeocoder). No key, no quota and no server
  # round trip, which is what lets a signed-out shopper use it. No web
  # implementation, so LocationService guards the call with kIsWeb.
  geocoding: ^4.0.0

  # Functional error handling (Failure / Either across layer boundaries)
  fpdart: ^1.1.0

  # Locale-aware money/date formatting (AppFormat + the num/DateTime
  # extensions over it) — separators, currency-symbol placement and month
  # names are CLDR data, never hand-tabulated per language.
  intl: any

  # Preset fonts (AppTheme resolves theme_config fontFamily at runtime —
  # no per-app font bundling)
  google_fonts: ^6.2.1

  # Sealed Failure type
  freezed_annotation: ^3.1.0

  # SVG rendering (AppSvgImage atom — brand glyphs, line icons)
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  freezed: ^3.2.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
